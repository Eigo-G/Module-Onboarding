<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Team T-Shirt Fundraiser</h1>
    </header>
    <main>
      <form>
        <!-- write your html here-->

        <label>First Name
        <input type="text" name="name" minlength="2" required />
        </label>
        <label>Last Name
        <input type="text" name="last-name" minlength="2" required />
        </label>
      <div>
        <label>Street Address & House Number
        <input type="text" name="address" required />
        </label>
        <label>City
        <input type="text" name="city" required />
        </label>
      </div>
      <div>
        <label>Postcode
        <input type="text" name="postcode" pattern="\d{4}" maxlength="4" required />
        </label>
      </div>
        <label>Phone Number
        <input type="tel" name="phone" required />
        </label>
        <label>Email
        <input type="email" name="email" required />
        </label>
        <label>Quantity
          <select name="quantity-unit" required>
            <option value="">Select</option>
            <option value="one">1</option>
            <option value="two">2</option>
            <option value="three">3</option>
            <option value="four">4</option>
            <option value="five">5</option>
          </select>
        </label>
        <label>Size
          <select name="size" required>
            <option value="" disabled selected>Select</option>
            <option value="extra-small">XS</option>
            <option value="small">S</option>
            <option value="medium">M</option>
            <option value="large">L</option>
            <option value="extra-large">XL</option>
            <option value="extra-extra-large">XXL</option>
          </select> 
        </label> 
      <div> 
        <label>Color
          <select name="color" required>
            <option value=""disabled selected>Select</option>
            <option value="team-logo-white">White Team Logo</option>
            <option value="team-logo-blue">Blue Team Logo</option>
            <option value="team-logo-black">Black Team Logo</option>
            <option value="team-logo-gray">Gray Team Logo</option>
            <option value="team-logo-red">Red Team Logo</option>
         </select>
        </label>
      </div>
      </div>
      <button type="submit">Submit</button> 
      </div>
      
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By Michael English</h2>
    </footer>
  </body>
</html>
