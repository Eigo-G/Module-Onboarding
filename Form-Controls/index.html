<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Team T-Shirt Fundraiser</h1>
    </header>
    <main>
      <form>
        <!-- write your html here-->
      <div>
        <label for="name">Name</label>
        <input type="text" name="name" minlength="2" required />
      </div>
      <div>
      <label for="email">Email</label>
        <input type="email" name="email" required />
        </label>
      </div>
      <div>
        <label for="size">Size</label>
          <select name="size" required>
            <option value="" disabled selected>Select</option>
            <option value="extra-small">XS</option>
            <option value="small">S</option>
            <option value="medium">M</option>
            <option value="large">L</option>
            <option value="extra-large">XL</option>
            <option value="extra-extra-large">XXL</option>
          </select> 
        </label> 
      <fieldset>
        <legend>Choose a Color:</legend>
        <div>
          <input type="radio" id="red" name="color" value="red" required /> <label for="red">Red</label>
        </div>
        <div>
          <input type="radio" id="blue" name="color" value="blue" required /> <label for="blue">Blue</label>
        </div>
        <div>
          <input type="radio" id="green" name="color" value="green" required /> <label for="green">Green</label>
        </div>
      </fieldset>
          

      
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By Michael English</h2>
    </footer>
  </body>
</html>
